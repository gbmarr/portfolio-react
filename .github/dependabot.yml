version: 2
updates:
  # Dependencias de la aplicación (package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'America/Argentina/Buenos_Aires'
    open-pull-requests-limit: 5
    labels:
      - 'security'
    commit-message:
      prefix: 'chore(deps)'
    versioning-strategy: 'increase'

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'America/Argentina/Buenos_Aires'
    open-pull-requests-limit: 5
    labels:
      - 'security'
    commit-message:
      prefix: 'chore(ci)'
